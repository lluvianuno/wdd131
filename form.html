<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review page composed of a form where the user can send their review..">
    <title>Product Review</title>
    <meta name="author" content="Lluvia Josephine Nuño López">

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-small.css">
    <script src="scripts/form.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html" class="wf1">

            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Choose a Product...</option>
            </select>
            

            <div class="stars">
                <label>Overall Rating</label>
                <div id="radio">
                    <label>&star;<input type="radio" id="one" name="stars"  required></label>
                    <label>&star;&star;<input type="radio" id="two" name="stars" required></label>
                    <label>&star;&star;&star;<input type="radio" id="three" name="stars" required></label>
                    <label>&star;&star;&star;&star;<input type="radio" id="four" name="stars" required></label>
                    <label>&star;&star;&star;&star;&star;<input type="radio" id="five" name="stars" required></label>
                </div>
            </div>

            <label>Date of Installation<input type="date" name="installation" id="dateOfInstallation" required></label>

            <div id="check">
                Which features did you find useful in the product?<br>
                <div>(Check all that apply)</div>

                <label><input type="checkbox" id="durability" name="durability"> Durability</label>
                <label><input type="checkbox" id="easeOfUse" name="easeOfUse"> Ease of Use</label>
                <label><input type="checkbox" id="performance" name="performance"> Performance</label>
                <label><input type="checkbox" id="design" name="design"> Design</label>
            </div>


            <label>Written Review <i>(optional)</i><input type="textarea" id="written" name="writtenReview"></label>
            <label>Your Name <i>(optional)</i><input type="text" id="name" name="userName"></label>

            <input type="Submit" value="Post Review">
        </form>

    </main>
</body>

<footer>

</footer>
