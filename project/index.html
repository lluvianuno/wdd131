<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Recipe Board</title>
    <meta name="description" content="-">
    <meta name="author" content="Lluvia Josephine Nuño López">

    <link rel="stylesheet" href="styles/home.css">
    <link rel="stylesheet" href="styles/home-large.css">
    <script src="scripts/project.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="">
        </div>
        <h1 id="title">The Recipe Board</h1>
        <nav class="navigation">
            <ul>
                <li><a href="#" id="home" class="active">Home</a></li>
                <li><a href="#" id="recipes">Recipes</a></li>
                <li><a href="#" id="favorites">Favorites</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="hero">
            <picture>
                <source srcset="images/hero-large.webp" media="(min-width: 1000px)">
                <source srcset="images/hero-small.webp" media="(min-width: 500px)">
                <img src="images/hero-small.webp" alt="Cooking" width="500" height="250">
            </picture>

        <h2>Recipes</h2>
        <div class="rec-grid"></div>


    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Lluvia Nuño | México</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
