<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Recipe Board</title>
    <meta name="description" content="-">
    <meta name="author" content="Lluvia Josephine Nuño López">

    <link rel="stylesheet" href="styles/project.css">
    <link rel="stylesheet" href="styles/project-large.css">
    <script src="scripts/project.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="">
        </div>

        <h1>The Recipe Board</h1>

        <button id="menu" aria-label="Toggle navigation menu">&#9776;</button>

        <nav class="navigation">
            <a href="index.html" id="home" class="active">Home</a>
            <a href="recipes.html" id="recipes">Recipes</a>
            <a href="favorites.html" id="favorites">Favorites</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <picture>
                <source srcset="images/hero-large.webp" media="(min-width: 1000px)">
                <source srcset="images/hero-small.webp" media="(min-width: 500px)">
                <img src="images/hero-small.webp" alt="Cooking" width="500" height="250">
            </picture>
        </div>

        <h2>Recipes</h2>
        <div class="rec-grid"></div>

        
        <h2>Post your own recipe!</h2>

        <form method="get" action="review.html" class="wf1">

            <label for="name">Name of your recipe: *</label>
            <input type="text" id="name" name="recipeName" required>

            <label for="time">Preparation time <i>(minutes)</i>: *</label>
            <input type="text" id="time" name="recipeTime" required>

            <label for="difficultyLevel">Difficulty <i>(optional)</i></label>
            <select id="difficultyLevel" name="difficulty">
            <option value="easy" selected>Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="advanced" selected>Advanced</option>
            <option value="" disabled selected>Select difficulty ...</option>
            </select>

            <label for="ingredients">Ingredients: *</label>
            <textarea id="ingredients" name="ingredients" required></textarea>
            <label for="instructions">Instructions: *</label>
            <textarea id="instructions" name="instructions" required></textarea>

            <label for="email">Email: *</label>
            <input type="email" id="email" name="email" required>

            <input type="submit" value="Send Recipe">

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Lluvia Nuño | México</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
